# 复制为 configs/application.properties（不进 git），或用环境变量 PA_SQLCONN 等覆盖。
#
# 必须是单独的评测库，库名里要有 eval，否则拒绝运行 —— 每次评测都会清空记忆和对话。
# 先建库：CREATE DATABASE private_assistant_eval DEFAULT CHARSET utf8mb4;
sqlconn=user:password@tcp(127.0.0.1:3306)/private_assistant_eval?charset=utf8mb4&parseTime=True&loc=Local

llm.anthropic.api_key=
llm.anthropic.base_url=
# 不配也能跑，检索退化为全文 + 结构化；配了更接近线上效果
llm.embedding.base_url=
llm.embedding.api_key=

# 可选：go run . -from-source 时只读地从这个库复制机器人、手册、对话规则，
# 评测管理端里改过的版本。建议给一个只有 SELECT 权限的账号。记忆和对话不会复制。
source.sqlconn=
