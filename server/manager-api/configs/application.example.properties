# 复制为 configs/application.properties（不进 git）。也可以用环境变量覆盖：PA_<KEY>，
# 点换成下划线、全大写，例如 PA_SQLCONN、PA_LLM_ANTHROPIC_API_KEY。
server.address=:10013
# 接口前缀：接口挂在 {context_path}/api 下，例如 /assistant-manager → /assistant-manager/api/...。留空就是 /api。
# 要和前端 client/manager/next.config.mjs 的 BASE_PATH 一致（前端拼的是 BASE_PATH + /api）。
server.context_path=/assistant-manager

# 服务器上的 MySQL 8（需要 utf8mb4；全文索引用 ngram 分词，MySQL 8 自带）。
# 先建库：CREATE DATABASE private_assistant DEFAULT CHARSET utf8mb4;
# 启动时自动建表（server/migrations/sql）。
sqlconn=user:password@tcp(127.0.0.1:3306)/private_assistant?charset=utf8mb4&parseTime=True&loc=Local

# 管理端会话有效期（秒）
auth.manager_ttl_seconds=604800

# 管理端还没有任何账号时，用这组账号创建首个管理员；之后改这里不会覆盖线上密码。
bootstrap.admin_username=admin
bootstrap.admin_password=

# 模型提供商的初始值：只在管理端「模型」里还没有对应提供商时写入，之后以管理端为准。
llm.anthropic.api_key=
llm.anthropic.base_url=
# 向量化：OpenAI 兼容的 /embeddings，例如通义 https://dashscope.aliyuncs.com/compatible-mode/v1
llm.embedding.base_url=
llm.embedding.api_key=

# 截图等附件存放目录，两个服务必须指向同一个目录（默认 ../data，即 server/data）。
storage.dir=../data

# 附件（照片、截图）存阿里云 OSS：bucket 留空则存本机 storage.dir。两个服务必须配成一样。
# 桶设为私有；同地域 ECS 可把 endpoint 写成内网地址 oss-<region>-internal.aliyuncs.com。
# 切到 OSS 后，storage.dir 里的旧附件仍可读取，不用搬。
storage.oss.region=
storage.oss.endpoint=
storage.oss.bucket=
storage.oss.access_key_id=
storage.oss.access_key_secret=
storage.oss.prefix=private_assistant
# 向量存哪：file（默认，服务器本地文件 {storage.dir}/vectors/）或 mysql（pa_memory_embedding 表）。
# 检索总是在进程内存里算，不需要向量数据库。两个服务要配成一样、指向同一个目录。
# 向量都能用记忆原文重新算出来，文件丢了重启会自动补算（要调一遍向量化接口）。
vector.store=file
vector.dir=
# 后台整理（原始记录 → 记忆）。两个服务都开也没问题，任务按行抢占。
worker.enabled=true
# 自动整理出的记忆，置信度不低于这个值才直接生效，否则进「待确认」。设成 1 表示全部都要确认。
extract.auto_confirm=0.85

# iPhone 主屏 PWA 推送。公钥/私钥是一对固定的 VAPID key，两个服务配置必须一致。
# 可用 `npx web-push generate-vapid-keys` 生成一次，后续不要更换。
push.vapid_public_key=
push.vapid_private_key=
push.vapid_subject=mailto:you@example.com
